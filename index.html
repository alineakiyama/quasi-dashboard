<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quasi · Support Dashboard</title>
<meta name="description" content="Customer support dashboard for Quasi.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23CB6387'/%3E%3C/svg%3E">
<script>
  /* Aplica o tema antes do CSS, para a página não piscar claro→escuro ao abrir. */
  try { var t = localStorage.getItem('quasi-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<a class="skip" href="#conteudo">Skip to content</a>

<!-- --------------------------------------------------------------- login -->
<div class="login" id="login" hidden>
  <div class="login__card">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">q</span>
      <div>
        <div class="brand__name">Quasi <span>Support</span></div>
        <div class="brand__sub">Commslayer · Shopify</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <p>This dashboard shows live support data. Access is by invitation.</p>
    <form class="login__form" id="login-form">
      <label>Email<input type="email" id="login-email" autocomplete="username" required></label>
      <label>Password<input type="password" id="login-password" autocomplete="current-password" required></label>
      <p class="login__error" id="login-error" role="alert"></p>
      <button class="btn btn--primary" type="submit" id="login-submit">Sign in</button>
    </form>
    <p class="login__note">No account? Ask your admin to invite you.</p>
  </div>
</div>

<!-- ---------------------------------------------------------------- app -->
<div id="app" hidden>

<header class="top">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">q</span>
    <div>
      <div class="brand__name">Quasi <span>Support</span></div>
      <div class="brand__sub">Commslayer · Shopify</div>
    </div>
  </div>
  <div class="meta">
    <div class="user"><span id="user-email"></span><button class="btn" id="signout" type="button">Sign out</button></div>
    <button class="btn" id="theme" type="button" aria-label="Switch colour theme">Theme: dark</button>
  </div>
</header>

<div class="toolbar">
  <nav class="tabs" aria-label="Sections">
    <button class="tab is-on" data-view="reports" type="button">Reports</button>
    <button class="tab" data-view="refunds" type="button">Refunds</button>
    <button class="tab" data-view="subscriptions" type="button">Subscriptions</button>
    <button class="tab" data-view="reshipments" type="button">Reshipments</button>
    <button class="tab" data-view="supplier" type="button">Supplier issues</button>
    <button class="tab" data-view="lookup" type="button">Order lookup</button>
    <button class="tab" data-view="datacheck" type="button">Data check</button>
  </nav>

</div>

<main class="content" id="conteudo" tabindex="-1">
  <div class="pagehead">
    <h1 id="view-title">Reports</h1>
    <p id="view-sub"></p>
  </div>
  <section class="view" id="view-reports" hidden></section>
  <section class="view" id="view-refunds" hidden></section>
  <section class="view" id="view-subscriptions" hidden></section>
  <section class="view" id="view-reshipments" hidden></section>
  <section class="view" id="view-supplier" hidden></section>
  <section class="view" id="view-lookup" hidden></section>
  <section class="view" id="view-datacheck" hidden></section>
</main>

</div>

<div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
